[versions]
agp = "9.3.1"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
androidx-activityCompose = "1.13.0"
androidx-lifecycle = "2.11.0"
# Must match the shared :skainet-ui design system's own pin (included build) — a mismatch
# pulls two Skiko versions onto the desktop classpath, which crashes with
# UnsatisfiedLinkError (getAdapterMaxTextureSize) at first render on macOS/Metal.
composeMultiplatform = "1.11.1"
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
kotlinxIo = "0.9.1"
# The transformers 0.58.0 pin; the catalog JSON and calibration files are read with it.
kotlinxSerialization = "1.11.0"
# The bert encoder, the SafeTensors reader and the engine tokenizers (WordPiece for LEAF) come from
# the engine BOM; the typed-decision contract, runtime and the Laya adapter need transformers 0.59.0+
# (0.60.0 runs Laya's exact GELU through the engine's exact gelu op instead of a host-side loop;
# 0.61.0 adds padded batches for the BERT and Laya encoders on engine 0.60.0).
skainet = "0.60.0"
skainet-transformers = "0.61.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# SKaiNET core — BOM-governed
skainet-bom = { module = "sk.ainet:skainet-bom", version.ref = "skainet" }
skainet-lang-core = { module = "sk.ainet.core:skainet-lang-core" }
skainet-backend-cpu = { module = "sk.ainet.core:skainet-backend-cpu" }
# Compile-time only on the JVM: PanamaVectorKernelProvider.isAvailable() for the kernel label.
skainet-backend-api = { module = "sk.ainet.core:skainet-backend-api" }
# Hand-written ARM NEON kernels — Android JNI only.
skainet-backend-jni-cpu = { module = "sk.ainet.core:skainet-backend-jni-cpu" }
skainet-data-source = { module = "sk.ainet.core:skainet-data-source" }
skainet-io-core = { module = "sk.ainet.core:skainet-io-core" }
skainet-io-safetensors = { module = "sk.ainet.core:skainet-io-safetensors" }
skainet-frontend-text = { module = "sk.ainet.core:skainet-frontend-text" }

# SKaiNET-transformers — BOM-governed
skainet-transformers-bom = { module = "sk.ainet.transformers:skainet-transformers-bom", version.ref = "skainet-transformers" }
skainet-transformers-inference-bert = { module = "sk.ainet.transformers:skainet-transformers-inference-bert" }
# Verifier only (-PlayaVerifier=true)
skainet-transformers-decisions-api = { module = "sk.ainet.transformers:skainet-transformers-decisions-api" }
skainet-transformers-decisions-runtime = { module = "sk.ainet.transformers:skainet-transformers-decisions-runtime" }
skainet-transformers-inference-laya = { module = "sk.ainet.transformers:skainet-transformers-inference-laya" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
