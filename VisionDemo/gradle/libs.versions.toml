[versions]
# Must match skainet-ui's AGP (included build): one AGP version per Gradle invocation.
agp = "9.3.1"
android-compileSdk = "37"
# The cartridge consumer library is built with minSdk 29.
android-minSdk = "29"
#noinspection EditedTargetSdkVersion
android-targetSdk = "37"
androidx-activityCompose = "1.12.2"
camerax = "1.4.2"
# The two cartridge artifacts out of SKaiNET-cartridge-blueprints move together.
cartridge = "0.2.2"
# Compose Multiplatform 1.12 (androidx compose 1.12) requires compileSdk 37.
composeMultiplatform = "1.12.2"
# Matches the Kotlin the cartridge artifacts (and SKaiNET 0.62.x) are compiled with.
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
# The engine under the cartridge runtime — resolved transitively, named here for the
# "Powered by SKaiNET" line (generateBuildInfo in composeApp).
skainet = "0.62.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# The blueprint's consumer library: opens, verifies and runs materialized packs. It
# api-exposes the yolo/v1 task-profile types (sk.ainet.cartridge.profiles:yolo-v1) the UI
# renders, and brings the IREE module runner + SKaiNET engine transitively. Code only —
# model weights and packs are never on Maven (see the README's licensing section).
cartridge-detection-yolov8 = { module = "sk.ainet.cartridge:detection-yolov8-iree", version.ref = "cartridge" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
